<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus – Übergreifende Oberfläche (Prototyp)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fff; --bg-alt:#fafafa; --bg-sunk:#f5f5f5;
  --fg:#111; --fg-mute:#666; --fg-faint:#999; --fg-ghost:#bbb;
  --line:#ddd; --line-soft:#eee;
  --accent:#111; --accent-fg:#fff;
  --focus:#005fcc;
  --ok:#2e7d32; --ok-bg:#eaf4ea;
  --warn:#b45309; --warn-bg:#fef3c7;
  --err:#c0392b; --err-bg:#fdecea;
  --info:#1d4ed8; --info-bg:#eff6ff;
}
body.dark{
  --bg:#16181c; --bg-alt:#1c1f24; --bg-sunk:#22262c;
  --fg:#e8eaed; --fg-mute:#a0a6b0; --fg-faint:#7c828c; --fg-ghost:#5a6069;
  --line:#2e333a; --line-soft:#262b31;
  --accent:#e8eaed; --accent-fg:#16181c;
  --focus:#5b9dff;
  --ok:#7bc47f; --ok-bg:#1e2a20;
  --warn:#e0a33a; --warn-bg:#2c2517;
  --err:#e57373; --err-bg:#2c1c1c;
  --info:#7aa7ff; --info-bg:#1a2130;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font-family:inherit;color:inherit}

/* ── Topbar ──────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 14px;height:56px;border-bottom:1px solid var(--line);flex-shrink:0;
}
#brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
#brand-mark{
  width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
#brand-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
#brand-sub{font-size:10px;color:var(--fg-ghost);text-transform:uppercase;letter-spacing:.08em}

.tb-select{
  padding:5px 8px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg-alt);color:var(--fg);font-size:12px;cursor:pointer;
}

/* Kontext-Chip */
#kontext-bar{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow:hidden}
.kchip{
  display:inline-flex;align-items:center;gap:7px;max-width:100%;
  padding:5px 8px 5px 10px;border-radius:20px;
  background:var(--info-bg);border:1px solid transparent;
  font-size:12px;color:var(--info);white-space:nowrap;overflow:hidden;
}
.kchip b{font-weight:600}
.kchip .kchip-sub{color:var(--fg-mute);overflow:hidden;text-overflow:ellipsis}
.kchip-x{
  border:none;background:none;cursor:pointer;color:inherit;
  font-size:13px;line-height:1;padding:1px 3px;border-radius:4px;opacity:.6;
}
.kchip-x:hover{opacity:1;background:rgba(0,0,0,.08)}
#kontext-leer{
  font-size:12px;color:var(--fg-ghost);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}

#topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#datenstand-wrap{display:flex;align-items:center;gap:5px}
#datenstand{font-size:11px;padding:4px 9px;border-radius:12px;white-space:nowrap;background:var(--bg-sunk);color:var(--fg-faint)}
#datenstand.live{background:var(--ok-bg);color:var(--ok)}
#datenstand.snapshot{background:var(--info-bg);color:var(--info)}
#datenstand.fallback{background:var(--warn-bg);color:var(--warn)}
#datenstand.laedt{background:var(--bg-sunk);color:var(--fg-faint)}
#search-wrap{position:relative}
#search{
  width:210px;padding:6px 10px;border:1px solid var(--line);border-radius:5px;
  font-size:13px;background:var(--bg-alt);color:var(--fg);outline:none;
}
#search:focus{border-color:var(--focus);background:var(--bg);box-shadow:0 0 0 3px rgba(0,95,204,.12)}
#search::placeholder{color:var(--fg-ghost)}
#search-results{
  display:none;position:absolute;top:calc(100% + 4px);right:0;width:340px;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;
  box-shadow:0 8px 26px rgba(0,0,0,.14);z-index:200;max-height:380px;overflow-y:auto;
}
#search-results.open{display:block}
.sr-group{padding:7px 13px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-ghost)}
.sr-item{padding:8px 13px;cursor:pointer;border-left:3px solid transparent;font-size:13px}
.sr-item:hover{background:var(--bg-sunk);border-left-color:var(--accent)}
.sr-sub{font-size:11px;color:var(--fg-faint);margin-top:2px}
.sr-empty{padding:14px;font-size:12px;color:var(--fg-faint);text-align:center}

.icon-btn{
  width:32px;height:32px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg-alt);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--bg-sunk)}
.icon-btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#user-chip{
  display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;
  border:1px solid var(--line);border-radius:20px;background:var(--bg-alt);font-size:12px;cursor:pointer;
}
#user-avatar{
  width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
}
#user-rolle{color:var(--fg-faint);font-size:11px}

/* ── Shell ───────────────────────────────────────── */
#shell{flex:1;display:flex;overflow:hidden}

/* ── Modul-Rail ──────────────────────────────────── */
#rail{
  width:var(--b-rail,224px);flex-shrink:0;border-right:1px solid var(--line);position:relative;
  background:var(--bg-alt);display:flex;flex-direction:column;overflow:hidden;
  transition:width .12s;
}
body.rail-slim #rail{width:56px}
#rail-scroll{flex:1;overflow-y:auto;padding:10px 0 4px}
.rail-group{margin-bottom:14px}
.rail-label{
  padding:4px 16px 6px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;color:var(--fg-ghost);
}
body.rail-slim .rail-label{opacity:0;height:10px;padding:0;overflow:hidden}
.rail-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 16px;border:none;background:none;cursor:pointer;
  font-size:13px;color:var(--fg-mute);text-align:left;
  border-left:3px solid transparent;
}
.rail-item:hover{background:var(--bg-sunk);color:var(--fg)}
.rail-item.active{background:var(--bg);color:var(--fg);font-weight:600;border-left-color:var(--accent)}
.rail-ico{width:18px;text-align:center;flex-shrink:0;font-size:14px}
.rail-txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rail-slim .rail-txt{display:none}
.rail-badge{
  font-size:10px;padding:1px 6px;border-radius:9px;
  background:var(--bg-sunk);color:var(--fg-faint);flex-shrink:0;
}
body.rail-slim .rail-badge{display:none}
#rail-foot{
  border-top:1px solid var(--line);padding:8px;display:flex;justify-content:flex-end;
}
#rail-toggle{
  border:none;background:none;cursor:pointer;color:var(--fg-faint);
  font-size:13px;padding:5px 8px;border-radius:5px;
}
#rail-toggle:hover{background:var(--bg-sunk);color:var(--fg)}

/* ── Arbeitsbereich ──────────────────────────────── */
#work{flex:1;display:flex;overflow:hidden;min-width:0}
.modul{flex:1;display:none;overflow:hidden;min-width:0}
.modul.active{display:flex}

/* Liste links */
.liste{
  width:var(--b-liste,290px);flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.liste-kopf{padding:13px 15px 11px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.liste-kopf p{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);margin-bottom:2px}
.liste-kopf span{font-size:12px;color:var(--fg-ghost)}
.btn-neu{
  font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg);cursor:pointer;white-space:nowrap;
}
.btn-neu:hover{background:var(--bg-sunk)}
.liste-suche{padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.liste-suche input{
  width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:5px;
  font-size:12px;background:var(--bg-alt);color:var(--fg);outline:none;
}
.liste-suche input:focus{border-color:var(--focus);background:var(--bg)}
.liste-scroll{flex:1;overflow-y:auto;padding:6px 0}
.li{
  padding:9px 15px;cursor:pointer;border-left:3px solid transparent;
  display:flex;gap:9px;align-items:flex-start;
}
.li:hover{background:var(--bg-sunk)}
.li.active{background:var(--bg-sunk);border-left-color:var(--accent)}
.li-txt{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:500;line-height:1.35}
.li-sub{font-size:11px;color:var(--fg-faint);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}

/* Baum */
.baum{list-style:none}
.baum ul{list-style:none}
.baum-row{
  display:flex;align-items:center;gap:5px;padding:5px 14px 5px 0;cursor:pointer;
  border-left:3px solid transparent;user-select:none;
}
.baum-row:hover{background:var(--bg-sunk)}
.baum-row.active{background:var(--bg-sunk);border-left-color:var(--accent)}
.baum-arrow{width:14px;text-align:center;font-size:9px;color:var(--fg-ghost);flex-shrink:0}
.baum-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Detail rechts */
.detail{flex:1;overflow-y:auto;padding:26px 32px 60px;min-width:0}
.detail h2{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-bottom:5px}
.detail-id{font-size:11px;color:var(--fg-ghost);font-family:ui-monospace,monospace;margin-bottom:20px}
.sektion{margin-bottom:22px;max-width:940px}
.sektion-label{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fg-faint);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--line-soft);
}
.feld{margin-bottom:11px}
.feld-label{font-size:11px;color:var(--fg-faint);margin-bottom:2px}
.feld-wert{font-size:13px;line-height:1.55}
.leer-hinweis{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--fg-ghost);font-size:13px;font-style:italic;padding:40px;text-align:center;
}

/* Pills */
.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;padding:2px 8px;border-radius:11px;
  background:var(--bg-sunk);color:var(--fg-mute);white-space:nowrap;
}
.pill.link{cursor:pointer}
.pill.link:hover{background:var(--accent);color:var(--accent-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.unbekannt{background:repeating-linear-gradient(135deg,var(--bg-sunk),var(--bg-sunk) 4px,transparent 4px,transparent 8px);color:var(--fg-faint);border:1px dashed var(--line)}
.pill-reihe{display:flex;flex-wrap:wrap;gap:6px}

/* Ziehgriffe zwischen den Spalten. 7px breit, aber optisch unsichtbar —
   sichtbar wird erst der Balken beim Überfahren. So bleibt die Trennlinie
   ruhig und die Trefferfläche trotzdem groß genug für die Maus. */
.griff{
  position:absolute;top:0;bottom:0;width:7px;z-index:20;
  cursor:col-resize;background:transparent;
}
.griff::after{
  content:'';position:absolute;top:0;bottom:0;left:3px;width:1px;
  background:var(--focus);opacity:0;transition:opacity .12s;
}
.griff:hover::after,.griff.zieht::after{opacity:.9;width:2px;left:2.5px}
.griff-rechts{right:-3px}
.griff-links{left:-3px}
body.zieht{cursor:col-resize;user-select:none}
body.zieht *{cursor:col-resize !important}

/* Ein-/ausklappbare Listenspalte */
.spalten-btn{
  border:none;background:none;cursor:pointer;color:var(--fg-faint);
  font-size:12px;padding:3px 6px;border-radius:5px;line-height:1;flex-shrink:0;
}
.spalten-btn:hover{background:var(--bg-sunk);color:var(--fg)}
body.spalte-zu .liste, body.spalte-zu .kette{display:none}
.spalte-auf{
  display:none;width:28px;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--bg-alt);cursor:pointer;align-items:flex-start;justify-content:center;
  padding-top:14px;
}
.spalte-auf:hover{background:var(--bg-sunk)}
.spalte-auf span{
  writing-mode:vertical-rl;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--fg-faint);margin-top:6px;
}
body.spalte-zu .spalte-auf{display:flex}

/* Kette */
.kette{
  width:var(--b-kette,230px);flex-shrink:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;background:var(--bg-alt);position:relative;
}
.kette-kopf{padding:13px 15px 11px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kette-kopf > div:first-child{flex:1;min-width:0}
.kette-kopf p{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint)}
.kette-vt{font-size:12px;margin-top:5px;line-height:1.4}
.kette-vt b{font-family:ui-monospace,monospace;font-size:11px}
.kette-liste{padding:12px 0;flex:1;overflow-y:auto}
.kette-schritt{
  display:flex;align-items:flex-start;gap:10px;padding:9px 15px;cursor:pointer;
  border-left:3px solid transparent;
}
.kette-schritt:hover{background:var(--bg-sunk)}
.kette-schritt.active{background:var(--bg);border-left-color:var(--accent)}
.kette-dot{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:10px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--fg-ghost);
}
.kette-dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.kette-dot.wip{background:var(--warn);border-color:var(--warn);color:#fff}
.kette-dot.unbekannt{border-style:dashed;color:var(--fg-ghost)}
.kette-txt{flex:1;min-width:0}
.kette-name{font-size:13px;font-weight:500}
.kette-stand{font-size:11px;color:var(--fg-faint);margin-top:2px}

/* Formulare */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;max-width:940px}
.form-grid.drei{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;color:var(--fg-faint)}
.f input,.f select,.f textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg-alt);color:var(--fg);font-size:13px;font-family:inherit;outline:none;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--focus);background:var(--bg)}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f.voll{grid-column:1/-1}
.check-liste{display:flex;flex-direction:column;gap:1px;max-width:940px}
.check-zeile{
  display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:6px;
}
.check-zeile:hover{background:var(--bg-sunk)}
.check-zeile input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:var(--focus)}
.check-txt{flex:1;font-size:13px;line-height:1.45}
.check-hint{font-size:11px;color:var(--fg-faint);margin-top:2px}

.aktionsleiste{
  display:flex;gap:9px;align-items:center;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line-soft);max-width:940px;
}
.btn{
  padding:8px 15px;border-radius:6px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);
}
.btn:hover{background:var(--bg-sunk)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{opacity:.85}
.btn.klein{padding:5px 11px;font-size:12px}

/* Ergebniskarten */
.karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:940px}
.karte{
  border:1px solid var(--line);border-radius:9px;padding:15px 17px;background:var(--bg-alt);
}
.karte-zahl{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.karte-label{font-size:11px;color:var(--fg-faint);margin-top:5px}
.karte-fuss{font-size:11px;margin-top:9px}

.balken{height:9px;border-radius:5px;background:var(--bg-sunk);overflow:hidden;margin-top:8px}
.balken i{display:block;height:100%;background:var(--accent);border-radius:5px}

table.tab{border-collapse:collapse;width:100%;max-width:940px;font-size:12.5px;margin-top:6px}
table.tab th,table.tab td{border-bottom:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
table.tab th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-faint);font-weight:700;border-bottom:1px solid var(--line)}
table.tab tr:hover td{background:var(--bg-sunk)}
table.tab td.num{text-align:right;font-variant-numeric:tabular-nums}

.hinweis{
  border-left:3px solid var(--info);background:var(--info-bg);color:var(--fg);
  padding:11px 14px;border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.55;max-width:940px;margin-bottom:18px;
}
.hinweis.warn{border-left-color:var(--warn);background:var(--warn-bg)}

/* Start */
.start-inner{padding:36px 40px 60px;overflow-y:auto;flex:1}
.start-hero h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.start-hero p{color:var(--fg-mute);margin-top:6px;font-size:13.5px;max-width:640px;line-height:1.6}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;max-width:1000px;margin-top:8px}
.nav-karte{
  border:1px solid var(--line);border-radius:10px;padding:17px 19px;cursor:pointer;background:var(--bg);
}
.nav-karte:hover{background:var(--bg-sunk);border-color:var(--fg-ghost)}
.nav-ico{font-size:19px}
.nav-titel{font-weight:600;font-size:14px;margin-top:9px}
.nav-desc{font-size:12px;color:var(--fg-faint);margin-top:4px;line-height:1.5}

/* ── Assistent ───────────────────────────────────── */
#assist{
  width:var(--b-assist,330px);flex-shrink:0;border-left:1px solid var(--line);position:relative;
  background:var(--bg-alt);display:flex;flex-direction:column;overflow:hidden;
}
body.assist-zu #assist{display:none}
#assist-kopf{
  padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
#assist-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
#assist-titel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);flex:1}
.mini-btn{
  border:none;background:none;cursor:pointer;color:var(--fg-faint);
  font-size:13px;padding:3px 6px;border-radius:4px;
}
.mini-btn:hover{background:var(--bg-sunk);color:var(--fg)}

#assist-kontext{
  padding:8px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;
}
#assist-kontext .kk-label{font-size:10px;color:var(--fg-ghost);text-transform:uppercase;letter-spacing:.07em;width:100%;margin-bottom:2px}
.kk{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;
  padding:2px 4px 2px 8px;border-radius:11px;background:var(--bg-sunk);color:var(--fg-mute);
}
.kk button{border:none;background:none;cursor:pointer;color:inherit;font-size:11px;opacity:.55;padding:0 3px}

<script>
/* ══════════════════════════════════════════════════════════════════════
   NEXUS WEBUI — PROTOTYP
   Daten werden zur LAUFZEIT geladen (ADR-002/ADR-004: Dateien sind die
   Quelle der Wahrheit, der Server liefert sie über die REST-API).
   Ladereihenfolge wie im KOOS-Server:
     1. REST-API des Servers        → "✓ Live"
     2. beigelegte Momentaufnahme   → "◷ Momentaufnahme"   (nexus-daten.json)
     3. Ordner öffnen (File System Access API, liest _daten/ direkt)
     4. eingebettete Notdaten       → "⚠ Fallback-Daten"
   Nur Punkt 4 ist im Quelltext hinterlegt — und zwar bewusst minimal.
   ══════════════════════════════════════════════════════════════════════ */

let OE=[], PROZESSE=[], SCHRITTE=[], DSTORES=[], REGELUNGEN=[], VVT=[],
    TOMS=[], BEDROHUNGEN=[], TOM_KATEGORIEN=[], KETTE={}, TOM_STAND={};
/* Die Datenschutzkette liegt seit 2026-08-07 als JSON je Verarbeitungstätigkeit
   im Datenverzeichnis (Generatoren aus der 9-Schritte-Vorgehensweise).
   Damit entfällt die frühere Kennzeichnung „keine Datenquelle". */
let K={bes:{}, risiko:{}, schwellwert:{}, tom:{}, bedrohungen:{}, ergaenzend:{}, dsfa:{}, baseline:null};

/* ── Notdaten: nur damit die Oberfläche ohne jede Quelle bedienbar bleibt ── */
const FALLBACK = {
  OE:[{id:'oe-hvb',name:'Bürgermeister/in (HVB)',parent:null,rollen:['Bürgermeister/in (HVB)'],sonder:[]},
      {id:'oe-amt-1-4',name:'1.4 – Datenschutz',parent:'oe-hvb',rollen:['Datenschutzbeauftragte/r'],sonder:['DSB (organisationsweit)']},
      {id:'oe-amt-33',name:'33 – Bürgerservice',parent:'oe-hvb',rollen:['Sachbearbeitung Meldewesen'],sonder:[]}],
  PROZESSE:[{id:'proc-meldebescheinigung-erteilen',name:'Meldebescheinigung erteilen',oe:'oe-amt-33',
      leika:'99050017',ozg:null,dstores:['dstore-melderegisterdaten'],regelungen:['§ 18 BMG'],beteiligte:[],sch:[0,1]}],
  SCHRITTE:['Antrag aufnehmen','Bescheinigung ausstellen'],
  DSTORES:[{id:'dstore-melderegisterdaten',name:'Melderegisterdaten',schutz:'C',bedarf:'hoch',
      vertraul:'intern',kategorie:'Wohnen & Melderecht',oe:'oe-amt-33',frist:'nach BMG-Fristen',
      rg:[{}].slice(0,0),art9:false,tags:['Melderecht']}],
  REGELUNGEN:[], VVT:[], TOMS:[], BEDROHUNGEN:[], TOM_KATEGORIEN:['ORG'],
};

/* ── Bearbeitungsstände der Datenschutzkette ──────────────────────────
   Es wird ausschließlich gemessen, was im Bestand steht.
     tom  → aus dem Feld `tom` des VVT-Eintrags
     besonderheiten / schwellenwert / risiko
          → liegen in der SQLite-Datenbank der DSMS-Anwendung. Dafür gibt es
            keine Schnittstelle, also gibt es hier auch keinen Wert. „unbekannt"
            heißt unbekannt und wird nicht durch eine plausible Zahl ersetzt.  */
/* Die Übersicht aus /api/kette trägt je Verarbeitungstätigkeit nur die
   Felder, die Listen, Stände und Kennzahlen brauchen — in derselben
   Verschachtelung wie die Quelldateien. Jeder Teilsatz wird als solcher
   gekennzeichnet; die Detailmodule holen den vollen Satz bei Bedarf nach. */
const KETTE_ZWEIGE=['bes','risiko','schwellwert','tom','bedrohungen','ergaenzend','dsfa'];

function ketteAusUebersicht(u){
  K={bes:{}, risiko:{}, schwellwert:{}, tom:{}, bedrohungen:{}, ergaenzend:{}, dsfa:{}, baseline:null};
  for(const [vid,e] of Object.entries(u||{}))
    for(const z of KETTE_ZWEIGE)
      if(e&&e[z]) K[z][vid]=Object.assign({_uebersicht:true}, e[z]);
}

let _ketteHolt=null;
async function ketteVervollstaendigen(){
  if(typeof aktiveVT!=='function') return;
  const v=aktiveVT(); if(!v||_ketteHolt===v.id) return;
  const teil=KETTE_ZWEIGE.some(z=>K[z][v.id]&&K[z][v.id]._uebersicht);
  if(!teil) return;
  _ketteHolt=v.id;
  try{
    const r=await fetch(`/api/kette/${encodeURIComponent(v.id)}`,{cache:'no-store'});
    if(r.ok){
      const d=await r.json();
      for(const z of KETTE_ZWEIGE) if(d[z]) K[z][v.id]=d[z];
      if(d.baseline) K.baseline=d.baseline;
      kettenstaendeErmitteln();
      renderModul();
    }
  }catch(e){ console.warn('Kette nicht nachladbar:', e); }
  finally{ _ketteHolt=null; }
}

function kettenstaendeErmitteln(){
  KETTE={}; TOM_STAND={};
  const stand=(o)=>{
    if(!o) return 'offen';
    const st=String((o.meta&&o.meta.status)||o.status||'').toLowerCase();
    if(st==='geprueft'||st==='freigegeben'||st==='abgeschlossen') return 'done';
    if(st==='entwurf'||st==='offen'||!st) return 'wip';
    return 'wip';
  };
  VVT.forEach(v=>{
    const t=K.tom[v.id];
    KETTE[v.id]={
      besonderheiten: stand(K.bes[v.id]),
      schwellwert:    stand(K.schwellwert[v.id]),
      risiko:         stand(K.risiko[v.id]),
      tom:            t ? ((t.ist||[]).length ? 'wip' : 'offen') : 'offen',
      dsfa:           stand(K.dsfa[v.id]),
    };
    const st={};
    (t&&t.soll||[]).forEach(id=>{ st[id]=(t.ist||[]).includes(id)?'umgesetzt':'offen'; });
    TOM_STAND[v.id]=st;
  });
}

               ' — jüngste Quelldatei '+((DATENSTAND_META&&DATENSTAND_META.juengste_quelldatei)||'?')+
               '. Für tagesaktuelle Zahlen den Datenordner über 📂 einlesen.'],

/* ── Ladekette ─────────────────────────────────────────────────────── */
async function datenLaden(){
  datenstand('laedt');
  const OPT={cache:'no-store'};
  const ok=r=>{ if(!r.ok) throw new Error(r.status); return r.json(); };

  /* 1) REST-API des Nexus-Servers */
  try{
    const [orga,proz,daten,reg,vvt,tom,thr,kette]=await Promise.all([
      fetch('/api/orga',OPT).then(ok),
      fetch('/api/prozesse',OPT).then(ok),
      fetch('/api/daten',OPT).then(ok),
      fetch('/api/regelungen',OPT).then(ok),
      fetch('/api/vvt',OPT).then(ok),
      fetch('/api/tom/definitionen',OPT).then(ok).catch(()=>[]),
      fetch('/api/tom/bedrohungen',OPT).then(ok).catch(()=>[]),
      /* Die Datenschutzkette in einem Abruf statt in 1.615 Einzeldateien.
         Fehlt der Endpunkt, bleibt die Kette leer und die Stammdaten stehen
         trotzdem — die Oberfläche zeigt dann „keine Datei vorhanden“. */
      fetch('/api/kette',OPT).then(ok).catch(()=>null),
    ]);
    ketteAusUebersicht(kette);
    datenUebernehmen(ausApi({orga,proz,daten,reg,vvt,tom,thr}));
    datenstand('live'); alleAnsichtenNeu(); return;
  }catch(e){ /* kein Server – weiter */ }

  /* 2) Quelldateien direkt über HTTP — der Datenordner liegt unter der
        ausgelieferten Wurzel, also lassen sich orga.yaml und die
        Markdown-Verzeichnisse unmittelbar lesen. Damit sind die Zahlen bei
        jedem Laden und jedem ⟳ auf dem Stand der Dateien, nicht auf dem
        Stand einer Kopie. */
  try{
    const roh=await quelldateienLesen();
    if(roh){ datenUebernehmen(ausApi(roh)); datenstand('quellen'); alleAnsichtenNeu(); return; }
  }catch(e){ console.warn('Quelldateien nicht lesbar:',e); }

  /* 3) Beigelegte Momentaufnahme */
  try{
    const r=await fetch('nexus-daten.json',OPT);
    if(r.ok){ datenUebernehmen(await r.json()); datenstand('snapshot'); alleAnsichtenNeu(); return; }
  }catch(e){ /* file:// blockiert fetch – weiter */ }

  /* 4) Notdaten */
  datenUebernehmen(FALLBACK); datenstand('fallback'); alleAnsichtenNeu();
  fallbackHinweis();
}

let _schrittIdx=[];
/* Verzeichnislisting des einfachen HTTP-Servers auswerten und alle
   Markdown-Dateien einlesen. Mehr als tausend Einzelabrufe — deshalb
   gebündelt und mit Fortschrittsanzeige. */
const DATEN_BASIS='/koos-knowledge/_daten';
async function verzeichnis(pfad){
  const r=await fetch(pfad+'/',{cache:'no-store'});
  if(!r.ok) throw new Error(pfad+' → '+r.status);
  const html=await r.text();
  return [...html.matchAll(/href="([^"?]+\.md)"/g)].map(m=>decodeURIComponent(m[1]))
    .map(n=>n.split('/').pop());
}
function frontmatter(text){
  const t=text.split('---');
  if(t.length<3) return null;
  try{ return window.jsyaml ? window.jsyaml.load(t[1]) : null; }catch(e){ return null; }
}
/* Nebenläufigkeit bewusst niedrig: python3 -m http.server bedient nur einen
   Request zugleich. Mehr gleichzeitige Abrufe machen es messbar langsamer. */
async function gebuendelt(liste, fn, breite, melde){
  const out=new Array(liste.length); let i=0, fertig=0;
  await Promise.all(Array.from({length:Math.min(breite,liste.length)},async()=>{
    for(;;){ const k=i++; if(k>=liste.length) return;
      out[k]=await fn(liste[k]);
      if((++fertig&63)===0 && melde) melde(fertig,liste.length);
    }}));
  return out.filter(Boolean);
}
/* Ein Katalog, gepflegt in dsms-knowledge/toms/ — dort lesen ihn auch die
   vier Generatoren (tom_, bedrohungen_, baseline_, ergaenzend_generator.py),
   die _daten/tom/ erzeugen. Am 29.08.2026 von der aelteren Kopie unter
   _input/vorgehensweise/assets/ hierher umgestellt: die trug 127 Massnahmen
   und kannte TOM-VIDEO-006 nicht, das in _daten/tom/ verwendet wird.
   Ueber die REST-API kommen dieselben Daten aus /api/tom/*. */
const KATALOG_BASIS='/dsms-knowledge/toms';
async function kataloge(art){
  const ordner = art==='tom' ? 'massnahmen' : 'gefaehrdungen';
  let namen;
  try{
    const r=await fetch(`${KATALOG_BASIS}/${ordner}/`,{cache:'no-store'});
    if(!r.ok) return [];
    const html=await r.text();
    namen=[...html.matchAll(/href="([^"?]+\.json)"/g)].map(m=>decodeURIComponent(m[1]).split('/').pop());
  }catch(e){ return []; }
  return gebuendelt(namen, async n=>{
    try{ const r=await fetch(`${KATALOG_BASIS}/${ordner}/${encodeURIComponent(n)}`,{cache:'no-store'});
         return r.ok?await r.json():null; }catch(e){ return null; }
  }, 12, (f,g)=>datenstand('laedt', `Katalog ${f}/${g}`));
}
/* Die sieben Dateisorten der Kette, je Verarbeitungstätigkeit.
   Der Dateiname trägt die VVT-ID, danach wird zugeordnet. */
const KETTE_ORDNER=[
  ['besonderheiten','bes-',        'bes'],
  ['risikoanalyse', 'risiko-',     'risiko'],
  ['schwellwert',   'schwellwert-','schwellwert'],
  ['tom',           'tom-',        'tom'],
  ['tom',           'bedrohungen-','bedrohungen'],
  ['tom',           'ergaenzend-', 'ergaenzend'],
  ['dsfa',          'dsfa-',       'dsfa'],
];
async function jsonListe(ordner){
  try{
    const r=await fetch(`${DATEN_BASIS}/${ordner}/`,{cache:'no-store'});
    if(!r.ok) return [];
    const html=await r.text();
    return [...html.matchAll(/href="([^"?]+\.json)"/g)].map(m=>decodeURIComponent(m[1]).split('/').pop());
  }catch(e){ return []; }
}
async function ketteLesen(){
  K={bes:{}, risiko:{}, schwellwert:{}, tom:{}, bedrohungen:{}, ergaenzend:{}, dsfa:{}, baseline:null};
  const ordner=[...new Set(KETTE_ORDNER.map(x=>x[0]))];
  const listen={};
  await Promise.all(ordner.map(async o=>{ listen[o]=await jsonListe(o); }));

  await Promise.all(KETTE_ORDNER.map(async ([ordn,praefix,ziel])=>{
    const namen=(listen[ordn]||[]).filter(n=>n.startsWith(praefix));
    await gebuendelt(namen, async n=>{
      try{
        const r=await fetch(`${DATEN_BASIS}/${ordn}/${encodeURIComponent(n)}`,{cache:'no-store'});
        if(!r.ok) return null;
        const d=await r.json();
        const id=(d.vvt_referenz&&d.vvt_referenz.vvt_id) || n.slice(praefix.length,-5);
        K[ziel][id]=d; return 1;
      }catch(e){ return null; }
    }, 8, (f,g)=>datenstand('laedt', `Kette ${ziel} ${f}/${g}`));
  }));
  try{
    const r=await fetch(`${DATEN_BASIS}/tom/baseline-organisation.json`,{cache:'no-store'});
    if(r.ok) K.baseline=await r.json();
  }catch(e){}
}

async function quelldateienLesen(){
  if(!window.jsyaml) return null;
  const y=await fetch(DATEN_BASIS+'/orga.yaml',{cache:'no-store'});
  if(!y.ok) return null;                       // Datenordner nicht ausgeliefert
  const orga=window.jsyaml.load(await y.text());

  const lies=async(ordner,mitBody)=>{
    let namen; try{ namen=await verzeichnis(DATEN_BASIS+'/'+ordner); }catch(e){ return []; }
    return gebuendelt(namen, async n=>{
      const r=await fetch(`${DATEN_BASIS}/${ordner}/${encodeURIComponent(n)}`,{cache:'no-store'});
      if(!r.ok) return null;
      const txt=await r.text(); const d=frontmatter(txt);
      if(!d) return null;
      if(mitBody) d.body=txt.split('---').slice(2).join('---').trim();
      return d;
    }, 24, (f,g)=>datenstand('laedt', `${ordner} ${f}/${g}`));
  };

  const [proz,daten,reg,vvt,tom,thr]=await Promise.all([
    lies('prozesse',true), lies('daten',false), lies('regelungen',true), lies('vvt',false),
    kataloge('tom'), kataloge('thr'),
  ]);
  if(!vvt.length && !proz.length) return null;
  await ketteLesen();
  return {orga:orga.einheiten||[], proz, daten, reg, vvt, tom, thr};
}

/* API-Antworten auf das interne Format normalisieren */
function ausApi(x){
  _schrittIdx=[];
  const feld=(o,...n)=>{ for(const k of n) if(o&&o[k]!=null) return o[k]; return null; };
  const idListe=a=>(a||[]).map(v=>typeof v==='string'?v:(v&&v.id)).filter(Boolean);
  return {
    OE:(x.orga||[]).map(o=>({id:o.id,name:o.name,parent:o.parent??null,
        rollen:o.rollen||[],sonder:o.sonderfunktionen||[],hinweis:o.hinweis||null})),
    PROZESSE:(x.proz||[]).map(p=>({id:p.id,name:feld(p,'titel','name'),oe:feld(p,'zustaendigeEinheit','oe'),
        beteiligte:(p.beteiligte||[]).map(b=>b&&b.einheit||b).filter(Boolean),
        leika:p.leika_id??null, ozg:p.ozg_id??null, status:p.status||null,
        dstores:idListe((p.daten||{}).datenspeicher), regelungen:p.regelungen||[],
        /* Die API liefert die Schritte fertig (Feld `schritte`, je Schritt
           name und beschreibung). Nur im Ordnerbetrieb muss der Fließtext
           zerlegt werden. */
        sch:(Array.isArray(p.schritte)&&p.schritte.length
              ? p.schritte.map(x=>String((x&&x.name)||x||'').trim())
              : (String(p.body||'').match(/^\*\*(\d+ [^*]+)\*\*/gm)||[])
                  .map(t=>t.replace(/\*\*/g,'').trim())
            ).filter(Boolean).map(s2=>{
          let k=_schrittIdx.indexOf(s2); if(k<0){ k=_schrittIdx.push(s2)-1; } return k; })})),
    SCHRITTE:_schrittIdx,
    /* Seit 2026-08-10 trennt die Klassifizierung zwei Sichten: Datenschutz
       (Schaden für die betroffene Person) und Informationssicherheit (Schaden
       für die Institution). Die alten Feldnamen werden weiter akzeptiert,
       damit ältere Bestände lesbar bleiben. */
    DSTORES:(x.daten||[]).map(d=>{ const kl=d.klassifizierung||{},
        au=kl.aufbewahrung||d.aufbewahrung||{},
        /* Die Quelldateien führen die Klassifizierung im Block, die API gibt
           sie flach heraus. Beides wird gelesen, damit Ordner- und
           Serverbetrieb dieselbe Anzeige ergeben. */
        f=(imBlock,flach)=>kl[imBlock] ?? d[flach ?? imBlock],
        /* Artikel-9-Merkmal ist kein Feld im Bestand (ADR 013 hat
           datenkategorie am 2026-08-15 abgeschafft). Gesucht wird in Name
           und Schlagworten, und es wird als Schlagworttreffer benannt. */
        such=`${d.name} ${(d.tags||[]).join(' ')}`,
        art9re=/gesundheit|biometr|religio|sozialdat|fingerabdruck|strafe?|sexual|gewerkschaft|ethni|genetisch|weltanschau/i;
      return {id:d.id,name:d.name,
        schutz:f('schutzstufe'), bedarf:f('schutzbedarf'),
        vertraul:kl.vertraulichkeitsklasse ?? kl.vertraulichkeit ?? d.vertraulichkeit,
        bsiV:f('bsi-vertraulichkeit'), bsiI:f('bsi-integritaet') ?? kl.integritaet,
        bsiA:f('bsi-verfuegbarkeit') ?? kl.verfuegbarkeit,
        bsiBedarf:f('bsi-schutzbedarf'),
        oe:d['zuständige-einheit']||d.zustaendigeEinheit,
        frist:[au.frist,au.beginn&&('ab '+au.beginn)].filter(Boolean).join(', ')||'—',
        rg:((kl.rechtsgrundlagen ?? d.rechtsgrundlagen)||[]).map(r=>r&&r.gesetz).filter(Boolean).slice(0,3),
        art9wort:(such.match(art9re)||[null])[0],
        art9:art9re.test(such),
        tags:(d.tags||[]).slice(0,5)};}),
    REGELUNGEN:(x.reg||[]).map(r=>({id:r.id,name:r.name,typ:r.typ,oe:r.zustaendigeEinheit,
        stand:String(r.datum||''),status:r.status,gremium:r.entscheidendesGremium,
        /* kontext und entscheidung sind mit Commit 90954fa aus dem Parser
           entfernt worden — sie kommen nicht mehr und werden nicht gelesen. */
        body:r.body||''})),
    VVT:(x.vvt||[]).map(v=>({id:v.id,uid:String(v.uid||''),titel:v.titel,oe:v.organisationseinheit,
        status:v.status,zweck:v.zweck,rechtsgrundlage:v.rechtsgrundlage,
        betroffene:v.kategorien_betroffener,datenarten:v.kategorien_daten,empfaenger:v.empfaenger,
        drittland:v.transfer_drittland,frist:v.loeschfrist,software:v.software_verarbeitungsmittel,
        prozesse:v.prozesse||[],dstores:idListe(v.datenspeicher),
        tom:(v.tom||[]).map(x=>typeof x==='string'?x:(x&&x.id)).filter(Boolean),
        leika:v.leika_id??null,ozg:v.ozg_id??null,stand:String(v.letzte_aktualisierung||v['letzte-aktualisierung']||'')})),
    TOMS:(x.tom||[]).map(t=>({id:t.id,kat:t.kategorie,name:t.name,typ:t['maßnahmentyp'],
        wirkung:t.wirkungspunktzahl,niveau:t.risikoniveau,beschreibung:t.beschreibung,
        ziele:((t.anwendbarkeit||{}).schutzziele)||[]})),
    BEDROHUNGEN:(x.thr||[]).map(t=>({id:t.id,kat:t.kategorie,typ:t.bedrohungstyp,
        name:t.name||String(t.id||'').replace(/^THREAT-/,'').replace(/-/g,' '),
        beschreibung:t.beschreibung,ziele:t.schutzziele||[],
        massnahmen:(t.empfohlene_massnahmen||[]).filter(x=>typeof x==='string'&&/^TOM-/.test(x))})),
  };
}

/* ── Ordner öffnen (File System Access API, wie im KOOS-Server) ─────── */
async function ordnerOeffnen(){
  if(!window.showDirectoryPicker){
    toast(location.protocol==='file:'
      ? 'Ordnerzugriff braucht einen sicheren Kontext — bitte über ./start-prototyp.sh starten'
      : 'Dieser Browser unterstützt die File System Access API nicht — Chrome oder Edge verwenden.');
    return;
  }
  if(!window.jsyaml){ toast('YAML-Parser nicht geladen'); return; }
  try{
    datenstand('laedt');
    const dir=await window.showDirectoryPicker({mode:'read'});
    const text=async h=>await (await h.getFile()).text();
    const front=t=>{ const p=t.split('---'); if(p.length<3) return [null,'']; 
      try{ return [window.jsyaml.load(p[1]), p.slice(2).join('---').trim()]; }catch(e){ return [null,'']; } };
    const ordner=async n=>{ try{ return await dir.getDirectoryHandle(n); }catch(e){ return null; } };
    const alle=async (h,fn)=>{ const out=[]; if(!h) return out;
      for await (const [name,e] of h.entries()) if(e.kind==='file'&&name.endsWith('.md')) out.push([name,await fn(e)]);
      return out; };

    const orga=window.jsyaml.load(await text(await dir.getFileHandle('orga.yaml')));
    const proz=(await alle(await ordner('prozesse'), async e=>front(await text(e)))).map(([,[d,b]])=>d&&({...d,_body:b})).filter(Boolean);
    const daten=(await alle(await ordner('daten'),   async e=>front(await text(e)))).map(([,[d]])=>d).filter(Boolean);
    const reg=(await alle(await ordner('regelungen'),async e=>front(await text(e)))).map(([,[d,b]])=>d&&({...d,body:b})).filter(Boolean);
    const vvt=(await alle(await ordner('vvt'),       async e=>front(await text(e)))).map(([,[d]])=>d).filter(Boolean);

    datenUebernehmen(ausApi({orga:orga.einheiten||[],proz,daten,reg,vvt,tom:[],thr:[]}));
    datenstand('ordner', dir.name); alleAnsichtenNeu();
    toast(`${OE.length} Einheiten · ${PROZESSE.length} Prozesse · ${VVT.length} VT gelesen`);
  }catch(e){
    if(e.name!=='AbortError'){ console.error(e); toast('Ordner konnte nicht gelesen werden: '+e.message); }
    datenstand('fallback');
  }
}

<script>
/* ── Modulregister ─────────────────────────────────────────────────── */
const GRUPPEN = [
  {label:null, module:[
    {id:'start', ico:'⌂', name:'Start'},
  ]},
  {label:'Stammdaten', module:[
    {id:'organisation', ico:'🏛', name:'Organisation', zahl:()=>OE.length},
    {id:'prozesse',     ico:'⚙', name:'Prozesse',     zahl:()=>PROZESSE.length},
    {id:'datenspeicher',ico:'🗄', name:'Datenspeicher',zahl:()=>DSTORES.length},
    {id:'regelungen',   ico:'📋', name:'Regelungen',   zahl:()=>REGELUNGEN.length},
  ]},
  {label:'Datenschutz', module:[
    {id:'vvt',            ico:'📑', name:'VVT', zahl:()=>VVT.length},
    {id:'besonderheiten', ico:'◐', name:'Besonderheiten', kette:true},
    {id:'schwellenwert',  ico:'⚖', name:'Schwellenwert',  kette:true},
    {id:'risiko',         ico:'⚠', name:'Risikoanalyse',  kette:true},
    {id:'tom',            ico:'🔒', name:'TOM & Gefahren', kette:true},
    {id:'dsfa',           ico:'⚖️', name:'DSFA', kette:true, zahl:()=>Object.keys(K.dsfa).length},
  ]},
  {label:'Auswertung', module:[
    {id:'dashboard',      ico:'📊', name:'Dashboard'},
    {id:'verknuepfungen', ico:'🕸', name:'Verknüpfungen'},
    {id:'berichte',   ico:'📄', name:'Berichte'},
    {id:'referenzen', ico:'📚', name:'Referenzen'},
  ]},
  {label:'System', module:[
    {id:'audit', ico:'🕘', name:'Audit'},
    {id:'admin', ico:'⚙️', name:'Admin'},
  ]},
];
const MODUL_NAME = {};
GRUPPEN.forEach(g=>g.module.forEach(m=>MODUL_NAME[m.id]=m.name));

/* ── Zustand ───────────────────────────────────────────────────────── */
const S = {
  modul:'start',
  kontext:{typ:null, id:null, text:null},   // typ: 'vt' | 'prozess' | 'oe'
  auswahl:{organisation:'oe-amt-33', prozesse:null, datenspeicher:null, regelungen:null, vvt:null},
  tomKat:'ORG',
  tomTab:'toms',
  graphKat:'', graphSort:'refs', graphNurSel:true, graphSel:null,
  vSicht:'proc-vvt', vAmt:'',
  filter:{prozesse:'', datenspeicher:'', vvt:'', regelungen:'', organisation:''},
  limit:{prozesse:120, datenspeicher:120, vvt:120, tomListe:60},
  verlauf:[],
  threads:[],
  thread:null,
  kkAus:new Set(),   // abgewählte Kontextbausteine
  letzterBezug:null, // was die letzte Frage aufgelöst hat
  spalteZu:false,    // Listenspalte eingeklappt
};

/* ── Helfer ────────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oeName = id => (OE.find(o=>o.id===id)||{}).name || id;
const vtById = id => VVT.find(v=>v.id===id);
const procById = id => PROZESSE.find(p=>p.id===id);
const dsById = id => DSTORES.find(d=>d.id===id);
const regById = id => REGELUNGEN.find(r=>r.id===id);

function toast(text){
  const t=$('#toast'); t.textContent=text; t.classList.add('an');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('an'),2400);
}

/* Schutzstufe einer VT: Maximum über verknüpfte Datenspeicher (reg-klassifizierung-001, 4.2) */
function schutzstufe(vt){
  const stufen=(vt.dstores||[]).map(id=>(dsById(id)||{}).schutz).filter(Boolean);
  if(!stufen.length) return null;
  return stufen.sort().reverse()[0];
}
function hatArt9(vt){ return (vt.dstores||[]).some(id=>(dsById(id)||{}).art9); }

/* Listenfilter: Suchbegriff + Kappung für lange Listen */
function filtern(modul, arr, textF){
  const q=(S.filter[modul]||'').trim().toLowerCase();
  const treffer = q ? arr.filter(x=>textF(x).toLowerCase().includes(q)) : arr;
  const lim = S.limit[modul] || treffer.length;
  return {treffer, sichtbar:treffer.slice(0,lim), gekappt:Math.max(0,treffer.length-lim)};
}
function mehrBtn(modul,g){
  return g.gekappt ? `<div style="padding:10px 15px"><button class="btn klein" style="width:100%" data-mehr="${modul}">
    Weitere ${Math.min(g.gekappt,200)} von ${g.gekappt} anzeigen</button></div>` : '';
}

const STAND_PILL = {done:['ok','vollständig'], wip:['warn','in Arbeit'], offen:['','offen'],
                    unbekannt:['unbekannt','keine Datenquelle']};
function standPill(st){
  const [cls,txt]=STAND_PILL[st]||STAND_PILL.offen;
  return `<span class="pill ${cls}">${txt}</span>`;
}

/* ── Rail rendern ──────────────────────────────────────────────────── */
function renderRail(){
  $('#rail-scroll').innerHTML = GRUPPEN.map(g=>`
    <div class="rail-group">
      ${g.label?`<div class="rail-label">${g.label}</div>`:''}
      ${g.module.map(m=>`
        <button class="rail-item${S.modul===m.id?' active':''}" data-modul="${m.id}" title="${esc(m.name)}">
          <span class="rail-ico">${m.ico}</span>
          <span class="rail-txt">${esc(m.name)}</span>
          ${m.zahl?`<span class="rail-badge">${m.zahl()}</span>`:''}
        </button>`).join('')}
    </div>`).join('');
}

/* ── Kontext ───────────────────────────────────────────────────────── */
function setzeKontext(typ, id){
  let text='', kurz='';
  if(typ==='vt'){ const v=vtById(id); text=v.uid+' · '+v.titel; kurz='VT'; }
  if(typ==='prozess'){ const p=procById(id); text=p.name; kurz='Prozess'; }
  if(typ==='oe'){ text=oeName(id); kurz='OE'; }
  S.kontext={typ,id,text,kurz};
  renderKontext(); renderAssistKontext();
}
function loeseKontext(){ S.kontext={typ:null,id:null,text:null}; renderKontext(); renderAssistKontext(); }

function renderKontext(){
  const leer=$('#kontext-leer'), chip=$('#kontext-chip');
  if(!S.kontext.typ){ leer.hidden=false; chip.hidden=true; return; }
  leer.hidden=true; chip.hidden=false;
  $('#kchip-typ').textContent=S.kontext.kurz;
  $('#kchip-text').textContent=S.kontext.text;
}

/* Kontextbausteine für den Assistenten */
function kontextBausteine(){
  /* Zwei Gruppen. Die Quellen zeigen, welche Bestände überhaupt angebunden sind —
     das war vorher nicht ablesbar und ließ KOOS fehlen wirken, obwohl fünf von
     sieben Werkzeugaufrufen dorthin gehen. Der Bezug zeigt, worauf sich die
     nächste Antwort stützt: gesetzt oder aus der Frage aufgelöst. */
  const q=[
    {k:'koos-orga',  gr:'quelle', label:`KOOS · ${OE.length} Einheiten`,        leer:!OE.length},
    {k:'koos-proc',  gr:'quelle', label:`KOOS · ${PROZESSE.length} Prozesse`,    leer:!PROZESSE.length},
    {k:'koos-daten', gr:'quelle', label:`KOOS · ${DSTORES.length} Datenspeicher · Schutzstufen`, leer:!DSTORES.length},
    {k:'koos-vvt',   gr:'quelle', label:`KOOS · ${VVT.length} VVT`,              leer:!VVT.length},
    {k:'koos-reg',   gr:'quelle', label:`KOOS · ${REGELUNGEN.length} Regelungen`,leer:!REGELUNGEN.length},
    {k:'tom',        gr:'quelle', label:`TOM-Katalog · ${TOMS.length}/${BEDROHUNGEN.length}`, leer:!TOMS.length},
    {k:'methodik',   gr:'quelle', label:'DSMS-Methodik'},
  ];
  const b=[{k:'modul', gr:'bezug', label:'Modul: '+MODUL_NAME[S.modul]}];
  if(S.kontext.typ==='vt'){
    const v=vtById(S.kontext.id);
    if(v){
      b.push({k:'vt', gr:'bezug', label:'VT '+v.uid+' (gesetzt)'});
      b.push({k:'oe', gr:'bezug', label:oeName(v.oe)});
      const st=schutzstufe(v); if(st) b.push({k:'schutz', gr:'bezug', label:'Schutzstufe '+st});
      b.push({k:'kette', gr:'bezug', label:'Kettenstand'});
    }
  } else if(S.kontext.typ==='prozess'){
    const pr=procById(S.kontext.id);
    if(pr){ b.push({k:'proc', gr:'bezug', label:'Prozess: '+pr.name.slice(0,26)});
            b.push({k:'oe', gr:'bezug', label:oeName(pr.oe)}); }
  } else if(S.kontext.typ==='oe'){
    b.push({k:'oe', gr:'bezug', label:oeName(S.kontext.id)});
  } else if(S.letzterBezug){
    /* kein gesetzter Kontext — dann zeigen, was die letzte Frage aufgelöst hat */
    const lb=S.letzterBezug;
    if(lb.vt)       b.push({k:'vt',   gr:'bezug', label:'VT '+lb.vt+' (erkannt)', fluechtig:true});
    if(lb.datenart) b.push({k:'ds',   gr:'bezug', label:'Datenart: '+lb.datenart.slice(0,24), fluechtig:true});
    if(lb.proc)     b.push({k:'proc', gr:'bezug', label:'Prozess: '+lb.proc.slice(0,26), fluechtig:true});
    if(lb.stufe) b.push({k:'schutz',gr:'bezug',label:'Schutzstufe '+lb.stufe, fluechtig:true});
    if(lb.reg)   b.push({k:'reg',  gr:'bezug', label:lb.reg.slice(0,30), fluechtig:true});
  } else {
    b.push({k:'auto', gr:'bezug', label:'wird aus der Frage aufgelöst', passiv:true});
  }
  return q.concat(b);
}

function chipHtml(x){
  if(x.passiv) return `<span class="kk passiv">${esc(x.label)}</span>`;
  const an=!S.kkAus.has(x.k) && !x.leer;
  const cls=x.leer?' leer':(an?' an':'');
  const titel=x.leer?'nicht geladen':(an?'einbezogen — klicken zum Abwählen':'ausgeschlossen — klicken zum Einbeziehen');
  return `<span class="kk${cls}${x.fluechtig?' fluechtig':''}" title="${titel}"><span>${esc(x.label)}</span>`+
         (x.leer?'<span style="opacity:.6">–</span>':`<button data-kk="${x.k}">${an?'✓':'○'}</button>`)+`</span>`;
}
function renderAssistKontext(){
  const bs=kontextBausteine();
  const quellen=bs.filter(x=>x.gr==='quelle'), bezug=bs.filter(x=>x.gr==='bezug');
  const block=(titel,liste)=>`<div class="kk-label">${titel}</div>`+liste.map(chipHtml).join('');
  const html=block('Angebundene Bestände', quellen)+block('Bezug der nächsten Antwort', bezug);
  const el=$('#assist-kontext'); if(el) el.innerHTML=html;
  const vc=$('#vc-kontext');
  if(vc) vc.innerHTML=`<span class="kk-label" style="width:auto;margin:0 6px 0 0">Bestände</span>`+
    quellen.map(chipHtml).join('')+
    `<span class="kk-label" style="width:auto;margin:0 6px 0 12px">Bezug</span>`+
    bezug.map(chipHtml).join('');
}

/* ── Modulwechsel ──────────────────────────────────────────────────── */
function geheZu(modul, opts={}){
  S.modul=modul;
  if(opts.vt){ setzeKontext('vt', opts.vt); S.auswahl.vvt=opts.vt; }
  if(opts.prozess){ S.auswahl.prozesse=opts.prozess; }
  if(opts.dstore){ S.auswahl.datenspeicher=opts.dstore; }
  if(opts.regelung){ S.auswahl.regelungen=opts.regelung; }
  if(opts.oe){ S.auswahl.organisation=opts.oe; }
  renderRail(); renderModul(); renderAssistKontext(); renderVorschlaege();
  document.body.classList.toggle('spalte-zu', S.spalteZu && !!document.querySelector('.spalte-auf'));
  $('#work').scrollTop=0;
}
</script>

<script>
/* ══ Modul-Renderer ═══════════════════════════════════════════════════ */
function renderModul(){
  const el=$('#work');
  const f=({
    start:mStart, organisation:mOrganisation, prozesse:mProzesse,
    datenspeicher:mDatenspeicher, regelungen:mRegelungen, vvt:mVVT,
    besonderheiten:mBesonderheiten, schwellenwert:mSchwellenwert,
    risiko:mRisiko, tom:mTOM, dsfa:mDSFA, dashboard:mDashboard, berichte:mBerichte,
    referenzen:mReferenzen, audit:mAudit, admin:mAdmin, verknuepfungen:mVerknuepfungen
  })[S.modul] || (()=>'<div class="leer-hinweis">Modul nicht gefunden</div>');
  el.innerHTML=`<div class="modul active">${f()}</div>`;

  /* Zeigt das Modul eine Verarbeitungstätigkeit im Einzelnen, wird ihr
     vollständiger Kettensatz nachgeholt und einmal neu gezeichnet. */
  if(typeof ketteVervollstaendigen==='function') ketteVervollstaendigen();

  /* Die Listenspalte kostet bei schmalen Fenstern den halben Platz. Der
     Knopf wird nachträglich angehängt, damit er nicht in jeden der neun
     Modul-Renderer einzeln geschrieben werden muss. */
  const kopf=el.querySelector('.liste-kopf, .kette-kopf');
  if(kopf){
    const b=document.createElement('button');
    b.className='spalten-btn'; b.id='spalte-zu-btn';
    b.title='Spalte einklappen'; b.setAttribute('aria-label','Listenspalte einklappen');
    b.textContent='⟨';
    kopf.appendChild(b);
    const strip=document.createElement('div');
    strip.className='spalte-auf'; strip.id='spalte-auf-btn';
    strip.title='Spalte ausklappen'; strip.setAttribute('role','button');
    strip.setAttribute('aria-label','Listenspalte ausklappen');
    strip.innerHTML='<span>⟩ '+esc(spaltenName())+'</span>';
    el.querySelector('.modul').insertBefore(strip, el.querySelector('.modul').firstChild);
  } else {
    document.body.classList.remove('spalte-zu');
  }
  griffeAnlegen();
}
function spaltenName(){
  return ({organisation:'Einheiten', prozesse:'Prozesse', datenspeicher:'Datenspeicher',
           regelungen:'Regelungen', vvt:'VVT'})[S.modul] || 'Kette';
}

/* ── Start ─────────────────────────────────────────────────────────── */
/* Alle Kennzahlen der Oberfläche werden hier gemessen — aus dem geladenen
   Bestand, ohne Schätzung. Was sich nicht messen lässt, taucht als Kachel
   „keine Datenquelle" auf, nicht als Zahl. */
function herkunftHinweis(){
  const el=document.getElementById('datenstand'); const art=el?el.className:'';
  const stil='text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg-ghost)';
  if(art==='live') return `<span style="${stil}">— aus den Quelldateien in diesem Moment gezählt</span>`;
  if(art==='snapshot') return `<span style="${stil}">— aus der Momentaufnahme ${esc((DATENSTAND_META&&DATENSTAND_META.erzeugt)||'')}; ⟳ liest die Quelldateien</span>`;
  return `<span style="${stil}">— aus Notdaten, nicht belastbar</span>`;
}
function kennzahlen(){
  const aktiv = VVT.filter(v=>String(v.status||'').toLowerCase()==='aktiv');
  const ohneProzess = VVT.filter(v=>!(v.prozesse||[]).length);
  const ohneDS      = VVT.filter(v=>!(v.dstores||[]).length);
  /* Die TOM-Zuordnung ist seit der 9-Schritte-Vorgehensweise nicht mehr das
     Frontmatter-Feld `tom`, sondern die Datei tom-[vvt-id].json. Das alte Feld
     ist überall leer und wäre als Kennzahl irreführend. */
  const ohneTOM     = VVT.filter(v=>!K.tom[v.id]);
  const ohneKette   = VVT.filter(v=>!K.bes[v.id]||!K.risiko[v.id]||!K.schwellwert[v.id]||!K.tom[v.id]);
  const ohneLeika   = VVT.filter(v=>!v.leika);
  const procOhneVVT = PROZESSE.filter(p=>!VVT.some(v=>(v.prozesse||[]).includes(p.id)));
  const dsOhneVVT   = DSTORES.filter(d=>!VVT.some(v=>(v.dstores||[]).includes(d.id)));
  const dsfaPflicht=Object.values(K.schwellwert).filter(w=>w.dsfa_pflicht_gesamt).length;
  const risikoHoch =Object.values(K.risiko).filter(r=>['hoch','sehr hoch'].includes(((r.basis_risiko||{}).schutzbedarf||'').toLowerCase())).length;
  const tomIstGepflegt=Object.values(K.tom).filter(t=>(t.ist||[]).length).length;
  const dsfaOffen  =Object.values(K.dsfa).filter(d=>((d.ergebnis||{}).bewertung||'offen')==='offen').length;
  return {aktiv, ohneProzess, ohneDS, ohneTOM, ohneKette, ohneLeika, procOhneVVT, dsOhneVVT,
          dsfaPflicht, risikoHoch, tomIstGepflegt, dsfaOffen};
}

function mStart(){
  const k=kennzahlen();
  const kachel=(zahl,label,fuss,cls)=>`<div class="karte"><div class="karte-zahl${cls?' '+cls:''}">${zahl}</div>
    <div class="karte-label">${label}</div>${fuss?`<div class="karte-fuss">${fuss}</div>`:''}</div>`;
  return `<div class="start-inner">
    <div class="start-hero">
      <h1>Kommunalverwaltung</h1>
      <p>Gemeinsame Oberfläche für Organisationsdaten (KOOS) und Datenschutzdokumentation (DSMS/TOM).
         Der Vorgangskontext bleibt über alle Module hinweg erhalten; der Assistent löst ihn sonst
         aus der Frage auf.</p>
    </div>

    <div class="sektion-label" style="margin:26px 0 10px;max-width:1000px">Bestand</div>
    <div class="karten">
      ${kachel(OE.length,'Organisationseinheiten')}
      ${kachel(PROZESSE.length,'Prozesse')}
      ${kachel(DSTORES.length,'Datenspeicher')}
      ${kachel(VVT.length,'Verarbeitungstätigkeiten',`davon ${k.aktiv.length} aktiv`)}
      ${kachel(REGELUNGEN.length,'Regelungen')}
    </div>

    <div class="sektion-label" style="margin:30px 0 10px;max-width:1000px">Schutzstufen der Datenspeicher ${herkunftHinweis()}</div>
    <div style="max-width:940px">
      ${(()=>{
        const st={A:0,B:0,C:0,D:0,E:0}; let ohne=0;
        DSTORES.forEach(d=>{ if(st[d.schutz]!=null) st[d.schutz]++; else ohne++; });
        const max=Math.max(...Object.values(st),ohne,1);
        const zeile=(label,n,cls)=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0">
          <span class="pill ${cls}" style="width:78px;text-align:center">${label}</span>
          <div class="balken" style="flex:1;margin:0"><i style="width:${Math.round(n/max*100)}%"></i></div>
          <span class="num" style="width:46px;text-align:right;font-variant-numeric:tabular-nums">${n}</span></div>`;
        return Object.entries(st).map(([se,n])=>zeile('Stufe '+se,n,se==='E'||se==='D'?'err':se==='C'?'warn':'')).join('')
             + zeile('nicht ableitbar',ohne,'err');
      })()}
      <div style="margin-top:12px"><button class="btn klein" data-go="dashboard:">Volle Auswertung im Dashboard \u2192</button></div>
    </div>

    <div class="sektion-label" style="margin:30px 0 10px;max-width:1000px">Gemessene Lücken ${herkunftHinweis()}</div>
    <div class="karten">
      ${kachel(k.ohneDS.length,'VT ohne Datenspeicher','<span class="pill err">keine Schutzstufe ableitbar</span>')}
      ${kachel(k.ohneProzess.length,'VT ohne Prozessbezug',
               `<span class="pill warn">${k.aktiv.filter(v=>!(v.prozesse||[]).length).length} davon aktiv</span>`)}
      ${kachel(k.ohneKette.length,'VT ohne vollständige Kette',
               `<span class="pill ${k.ohneKette.length?'warn':'ok'}">Schritte 3–5 je Datei</span>`)}
      ${kachel(k.ohneLeika.length,'VT ohne LeiKa-ID')}
      ${kachel(k.procOhneVVT.length,'Prozesse ohne VVT-Eintrag','<span class="pill warn">Art. 30 DSGVO</span>')}
    </div>

    <div class="sektion-label" style="margin:30px 0 10px;max-width:1000px">Datenschutzkette ${herkunftHinweis()}</div>
    <div class="karten">
      ${kachel(Object.keys(K.bes).length+' / '+VVT.length,'Besonderheiten')}
      ${kachel(Object.keys(K.schwellwert).length+' / '+VVT.length,'Schwellwertanalyse',
               `<span class="pill ${k.dsfaPflicht?'warn':''}">${k.dsfaPflicht} mit DSFA-Pflicht</span>`)}
      ${kachel(Object.keys(K.risiko).length+' / '+VVT.length,'Risikoanalyse',
               `<span class="pill warn">${k.risikoHoch} mit hohem Schutzbedarf</span>`)}
      ${kachel(Object.keys(K.tom).length+' / '+VVT.length,'TOM-Zuordnung',
               `<span class="pill ${k.tomIstGepflegt?'':'err'}">${k.tomIstGepflegt} mit IST-Status</span>`)}
      ${kachel(Object.keys(K.dsfa).length+' / '+VVT.length,'DSFA',

/* ── Datenspeicher ─────────────────────────────────────────────────── */
const BSI_RANG={'normal':1,'hoch':2,'sehr hoch':3};
function bsiCls(w){ return ({1:'',2:'warn',3:'err'})[BSI_RANG[w]||0]||''; }
const STUFE_RANG={A:1,B:2,C:3,D:4,E:5};

/* Auffälligkeiten zwischen den beiden Sichten. Sie sind kein Fehler — die
   Skalen messen Verschiedenes —, aber sie sind der Ansatzpunkt für die
   fachliche Durchsicht. */
function divergenz(d){
  const st=STUFE_RANG[d.schutz]||0, i=BSI_RANG[d.bsiI]||0, a=BSI_RANG[d.bsiA]||0, v=BSI_RANG[d.bsiV]||0;
  const out=[];
  if(st>=4 && i<=1) out.push('Datenschutz-Stufe '+d.schutz+', aber BSI-Integrität normal — eine unbemerkte Verfälschung träfe hier unmittelbar Entscheidungen über Menschen.');
  if(st>=4 && a<=1) out.push('Datenschutz-Stufe '+d.schutz+', aber BSI-Verfügbarkeit normal — trägt die Aufgabenerfüllung einen Ausfall wirklich?');
  if(st<=2 && i>=2) out.push('Niedrige Datenschutz-Stufe bei erhöhter Integritätsanforderung — plausibel bei amtlichen Veröffentlichungen, sonst zu begründen.');
  if(st>=4 && v<=1) out.push('Datenschutz-Stufe '+d.schutz+', aber BSI-Vertraulichkeit normal — für die Institution folgenlos, für die Betroffenen nicht.');
  return out;
}

  const o={};
  if(hatArt9(v)) o.art9=true;
  if(/MS365|Microsoft/i.test(v.software||'')) o.microsoft365=true;
  if(/SaaS|Cloud|Rechenzentrum/i.test(v.software||'')) o.cloud=true;
  if(/Auftragsverarbeiter/i.test(v.empfaenger||'')) o.auftragsverarbeitung=true;
  if(/Beschäftigte|Beamt/i.test(v.betroffene||'')) o.beschaeftigtendaten=true;
  if(/Sozialdaten|SGB/i.test((v.datenarten||'')+(v.rechtsgrundlage||''))) o.sozialdaten=true;
  if(/Straftat|Vorstrafe|Führungszeugnis|Ordnungswidrigkeit/i.test(v.datenarten||'')) o.art10=true;
  if(/Video/i.test((v.datenarten||'')+(v.software||''))) o.videoueberwachung=true;
  return o;
}

/* ══ Abhängigkeitsgraph Gefährdungen ↔ Maßnahmen ══════════════════════
   Nachbau der Übersicht aus DS-TOM: zwei Spalten, Kanten aus dem Feld
   `empfohlene_massnahmen` der Gefährdungen. Klick auf einen Knoten hebt
   seine Verbindungen hervor. Der Graph beantwortet die Frage, die eine
   Tabelle nicht beantwortet: Welche Maßnahme trägt wie viele Gefährdungen —
   und welche Gefährdung steht ohne Maßnahme da.                         */
function tomGraph(threats, sollIds, ist){
  const kat=S.graphKat||'', nurSel=S.graphNurSel!==false;
  const tById=id=>BEDROHUNGEN.find(x=>x.id===id)||{};
  const mById=id=>TOMS.find(x=>x.id===id)||{id,name:'(nicht im Katalog)',kat:'—'};

  let G=threats.map(t=>({...tById(t.id), ...t})).filter(t=>t.id);
  if(kat) G=G.filter(t=>t.kat===kat||t.kategorie===kat);

  const kanten=[];
  G.forEach(t=>((t.massnahmen)||[]).forEach(m=>{
    if(nurSel && sollIds.length && !sollIds.includes(m)) return;
    kanten.push([t.id,m]);
  }));
  const mIds=[...new Set(kanten.map(k=>k[1]))].sort();
  const grad={}; kanten.forEach(([,m])=>grad[m]=(grad[m]||0)+1);
  const tGrad={}; kanten.forEach(([t])=>tGrad[t]=(tGrad[t]||0)+1);
  const sort=S.graphSort||'refs';
  const mSort=[...mIds].sort((a,b)=> sort==='refs' ? (grad[b]-grad[a])||a.localeCompare(b)
    : sort==='wirkung' ? ((mById(b).wirkung||0)-(mById(a).wirkung||0))||a.localeCompare(b)
    : a.localeCompare(b));
  const tSort=[...G].sort((a,b)=>(tGrad[b.id]||0)-(tGrad[a.id]||0)||a.id.localeCompare(b.id));

  const H=22, oben=30, breite=940, xL=250, xR=breite-250;
  const hoehe=Math.max(tSort.length,mSort.length)*H+oben+20;
  const yT={}, yM={};
  tSort.forEach((t,i)=>yT[t.id]=oben+i*H);
  mSort.forEach((m,i)=>yM[m]=oben+i*H);
  const ohne=tSort.filter(t=>!(tGrad[t.id]||0));
  const hub=mSort[0];

  const kantenSvg=kanten.map(([t,m])=>{
    const y1=yT[t], y2=yM[m];
    if(y1==null||y2==null) return '';
    return `<path class="gk" data-t="${esc(t)}" data-m="${esc(m)}"
      d="M${xL} ${y1} C${xL+90} ${y1}, ${xR-90} ${y2}, ${xR} ${y2}"/>`;
  }).join('');

  const knotenT=tSort.map(t=>`<g class="gn gn-t" data-id="${esc(t.id)}">
      <circle cx="${xL}" cy="${yT[t.id]}" r="4"/>
      <text x="${xL-10}" y="${yT[t.id]+4}" text-anchor="end">${esc(t.id)} · ${esc(String(t.name||t.beschreibung||'').slice(0,42))}</text>
      <text class="gd" x="${xL+9}" y="${yT[t.id]+4}">${tGrad[t.id]||0}</text></g>`).join('');
  const knotenM=mSort.map(m=>{const o=mById(m); const um=ist.includes(m);
    return `<g class="gn gn-m${um?' um':''}" data-id="${esc(m)}">
      <circle cx="${xR}" cy="${yM[m]}" r="4"/>
      <text x="${xR+10}" y="${yM[m]+4}">${esc(m)} · ${esc(String(o.name||'').slice(0,44))}</text>
      <text class="gd" x="${xR-9}" y="${yM[m]+4}" text-anchor="end">${grad[m]||0}</text></g>`;}).join('');

  const kats=[...new Set(BEDROHUNGEN.map(x=>x.kat).filter(Boolean))].sort();
  const linksN=tSort.map(t=>({id:t.id,label:`${t.id} · ${String(t.name||t.beschreibung||'')}`,grad:tGrad[t.id]||0}));
  const rechtsN=mSort.map(m=>({id:m,label:`${m} · ${String(mById(m).name||'')}`,grad:grad[m]||0,
                               cls:ist.includes(m)?'um':''}));
  return `
  <div class="karten" style="margin-bottom:14px">
    <div class="karte"><div class="karte-zahl">${tSort.length}</div><div class="karte-label">Gefährdungen</div></div>
    <div class="karte"><div class="karte-zahl">${mSort.length}</div><div class="karte-label">verknüpfte Maßnahmen</div></div>
    <div class="karte"><div class="karte-zahl">${kanten.length}</div><div class="karte-label">Verknüpfungen</div></div>
    <div class="karte"><div class="karte-zahl" style="font-size:15px">${hub?esc(hub):'—'}</div>
      <div class="karte-label">zentralste Maßnahme</div>
      <div class="karte-fuss">${hub?`deckt ${grad[hub]} Gefährdungen · ${esc(String(mById(hub).name||'').slice(0,40))}`:''}</div></div>
    <div class="karte"><div class="karte-zahl ${ohne.length?'':''}">${ohne.length}</div>
      <div class="karte-label">ohne Maßnahme</div>
      ${ohne.length?`<div class="karte-fuss"><span class="pill warn">Lücke</span></div>`:''}</div>
  </div>

  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <span style="font-size:11px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.07em">Kategorie</span>
    <button class="btn klein${kat?'':' primary'}" data-gkat="">alle</button>
    ${kats.map(k=>`<button class="btn klein${kat===k?' primary':''}" data-gkat="${esc(k)}">${esc(k)}</button>`).join('')}
    <span style="width:14px"></span>
    <span style="font-size:11px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.07em">Sortierung</span>
    ${[['refs','Häufigkeit'],['wirkung','Wirkung'],['id','ID']].map(([k,t])=>
      `<button class="btn klein${sort===k?' primary':''}" data-gsort="${k}">${t}</button>`).join('')}
    <span style="width:14px"></span>
    <button class="btn klein${nurSel?' primary':''}" data-gsel="${nurSel?'0':'1'}">${nurSel?'nur SOLL-Maßnahmen':'alle empfohlenen'}</button>
  </div>

  ${graphSvg(linksN, rechtsN, kanten, 'Gefährdungen', 'Maßnahmen')}`;
}

/* ══ Gemeinsamer Renderer für zweispaltige Graphen ════════════════════
   Wird von TOM & Gefahren und vom Modul Verknüpfungen benutzt. Knoten
   links, Knoten rechts, Kanten dazwischen; Klick hebt hervor.           */
function graphSvg(links, rechts, kanten, titelL, titelR){
  const H=22, oben=30, breite=980, xL=270, xR=breite-270;
  const yL={}, yR={};
  links.forEach((n,i)=>yL[n.id]=oben+i*H);
  rechts.forEach((n,i)=>yR[n.id]=oben+i*H);
  const hoehe=Math.max(links.length,rechts.length)*H+oben+20;
  const kSvg=kanten.map(([a,b])=>{
    const y1=yL[a], y2=yR[b];
    if(y1==null||y2==null) return '';
    return `<path class="gk" data-t="${esc(a)}" data-m="${esc(b)}"
      d="M${xL} ${y1} C${xL+95} ${y1}, ${xR-95} ${y2}, ${xR} ${y2}"/>`;
  }).join('');
  const knoten=(liste,x,y,seite)=>liste.map(n=>`<g class="gn gn-${seite}${n.cls?' '+n.cls:''}" data-id="${esc(n.id)}">
      <circle cx="${x}" cy="${y[n.id]}" r="4"/>
      <text x="${seite==='t'?x-10:x+10}" y="${y[n.id]+4}"${seite==='t'?' text-anchor="end"':''}>${esc(String(n.label).slice(0,52))}</text>
      <text class="gd" x="${seite==='t'?x+9:x-9}" y="${y[n.id]+4}"${seite==='m'?' text-anchor="end"':''}>${n.grad??''}</text></g>`).join('');
  return `<div id="graph-info">Knoten anklicken, um seine Verknüpfungen hervorzuheben</div>
  <div id="graph-wrap"><svg id="dep-graph" viewBox="0 0 ${breite} ${hoehe}" style="height:${hoehe}px">
      <text class="gh" x="${xL}" y="16" text-anchor="end">${esc(titelL)}</text>
      <text class="gh" x="${xR}" y="16">${esc(titelR)}</text>
      <g class="gkanten">${kSvg}</g>${knoten(links,xL,yL,'t')}${knoten(rechts,xR,yR,'m')}
    </svg></div>`;
}

/* ══ Modul Verknüpfungen ══════════════════════════════════════════════
   Prozesse ↔ VVT ist die Sicht, an der sich Lücken nach Art. 30 DSGVO
   ablesen lassen: ein Prozess ohne Kante ist nicht dokumentiert, ein
   VVT-Eintrag ohne Kante hat keinen Prozessbezug.                       */
function mVerknuepfungen(){
  const sicht=S.vSicht||'proc-vvt';
  const amt=S.vAmt||'';
  const aemter=[...new Set([...PROZESSE.map(p=>p.oe),...VVT.map(v=>v.oe)].filter(Boolean))]
    .sort((a,b)=>oeName(a).localeCompare(oeName(b)));
  const kopf=`
    <h2>Verknüpfungen</h2>
    <div class="detail-id">${sicht==='proc-vvt'?'Prozesse ↔ Verarbeitungstätigkeiten'
      :sicht==='vvt-ds'?'Verarbeitungstätigkeiten ↔ Datenspeicher':'Organisationseinheit ↔ Verarbeitungstätigkeiten'}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px">
      ${[['proc-vvt','Prozesse ↔ VVT'],['vvt-ds','VVT ↔ Datenspeicher'],['oe-vvt','Ämter ↔ VVT']].map(([k,t])=>
        `<button class="btn klein${sicht===k?' primary':''}" data-vsicht="${k}">${t}</button>`).join('')}
      <span style="width:14px"></span>
      <span style="font-size:11px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.07em">Amt</span>
      <select class="tb-select" data-vamt>
        <option value="">— alle (nur Zähler) —</option>
        ${aemter.map(o=>`<option value="${esc(o)}"${amt===o?' selected':''}>${esc(oeName(o))}</option>`).join('')}
      </select>
    </div>`;

  if(sicht==='oe-vvt'){
    const proOE={}; VVT.forEach(v=>{ (proOE[v.oe]=proOE[v.oe]||[]).push(v); });
    const links=Object.keys(proOE).sort((a,b)=>proOE[b].length-proOE[a].length)
      .map(o=>({id:o,label:oeName(o),grad:proOE[o].length}));
    const rechts=VVT.filter(v=>!amt||v.oe===amt).map(v=>({id:v.id,label:v.uid+' '+v.titel,grad:''}));
    const kanten=rechts.map(r=>[(VVT.find(v=>v.id===r.id)||{}).oe, r.id]).filter(k=>k[0]);
    return `<div class="detail">${kopf}
      <div class="hinweis">${rechts.length} Verarbeitungstätigkeiten über ${links.length} Ämter.</div>
      ${graphSvg(links, rechts, kanten, 'Organisationseinheiten', 'Verarbeitungstätigkeiten')}</div>`;
  }

  if(sicht==='vvt-ds'){
    const vs=VVT.filter(v=>!amt||v.oe===amt);
    const dsIds=[...new Set(vs.flatMap(v=>v.dstores||[]))];
    const grad={}; vs.forEach(v=>(v.dstores||[]).forEach(d=>grad[d]=(grad[d]||0)+1));
    const links=vs.map(v=>({id:v.id,label:v.uid+' '+v.titel,grad:(v.dstores||[]).length,
      cls:(v.dstores||[]).length?'':'leer'}));
    const rechts=dsIds.map(d=>dsById(d)).filter(Boolean)
      .sort((a,b)=>(grad[b.id]||0)-(grad[a.id]||0))
      .map(d=>({id:d.id,label:d.name+' · '+d.schutz,grad:grad[d.id]||0,cls:d.art9?'art9':''}));
    const kanten=vs.flatMap(v=>(v.dstores||[]).map(d=>[v.id,d]));
    const ohne=vs.filter(v=>!(v.dstores||[]).length).length;
    return `<div class="detail">${kopf}
      <div class="karten" style="margin-bottom:14px">
        <div class="karte"><div class="karte-zahl">${vs.length}</div><div class="karte-label">Verarbeitungstätigkeiten</div></div>
        <div class="karte"><div class="karte-zahl">${dsIds.length}</div><div class="karte-label">genutzte Datenspeicher</div></div>
        <div class="karte"><div class="karte-zahl">${kanten.length}</div><div class="karte-label">Verknüpfungen</div></div>
        <div class="karte"><div class="karte-zahl">${ohne}</div><div class="karte-label">VT ohne Datenspeicher</div>
          ${ohne?'<div class="karte-fuss"><span class="pill err">keine Schutzstufe</span></div>':''}</div>
      </div>
      ${graphSvg(links, rechts, kanten, 'Verarbeitungstätigkeiten', 'Datenspeicher')}</div>`;
  }

  /* Prozesse ↔ VVT */
  const ps=PROZESSE.filter(p=>!amt||p.oe===amt);
  const vs=VVT.filter(v=>!amt||v.oe===amt);
  const pIds=new Set(ps.map(p=>p.id));
  const kanten=[];
  vs.forEach(v=>(v.prozesse||[]).forEach(pid=>{ if(pIds.has(pid)) kanten.push([pid,v.id]); }));
  const gradP={}, gradV={};
  kanten.forEach(([a,b])=>{ gradP[a]=(gradP[a]||0)+1; gradV[b]=(gradV[b]||0)+1; });
  const links=ps.sort((a,b)=>(gradP[b.id]||0)-(gradP[a.id]||0)||a.name.localeCompare(b.name))
    .map(p=>({id:p.id,label:p.name,grad:gradP[p.id]||0,cls:gradP[p.id]?'':'leer'}));
  const rechts=vs.sort((a,b)=>(gradV[b.id]||0)-(gradV[a.id]||0)||String(a.uid).localeCompare(String(b.uid)))
    .map(v=>({id:v.id,label:v.uid+' '+v.titel,grad:gradV[v.id]||0,cls:gradV[v.id]?'':'leer'}));
  const pOhne=links.filter(x=>!x.grad).length, vOhne=rechts.filter(x=>!x.grad).length;
  const zuViel=[...links].sort((a,b)=>b.grad-a.grad)[0];
  return `<div class="detail">${kopf}
    <div class="karten" style="margin-bottom:14px">
      <div class="karte"><div class="karte-zahl">${ps.length}</div><div class="karte-label">Prozesse</div></div>
      <div class="karte"><div class="karte-zahl">${vs.length}</div><div class="karte-label">Verarbeitungstätigkeiten</div></div>
      <div class="karte"><div class="karte-zahl">${kanten.length}</div><div class="karte-label">Verknüpfungen</div></div>
      <div class="karte"><div class="karte-zahl">${pOhne}</div><div class="karte-label">Prozesse ohne VVT</div>
        ${pOhne?'<div class="karte-fuss"><span class="pill warn">Art. 30 DSGVO</span></div>':''}</div>
      <div class="karte"><div class="karte-zahl">${vOhne}</div><div class="karte-label">VT ohne Prozessbezug</div></div>
    </div>
    ${zuViel&&zuViel.grad>1?`<div class="hinweis">Am stärksten gebündelt: <b>${esc(zuViel.label)}</b> —
      in ${zuViel.grad} Verarbeitungstätigkeiten referenziert.</div>`:''}
    ${!amt&&ps.length>260?`<div class="hinweis warn">${ps.length} Prozesse und ${vs.length} VT ergeben einen
      unlesbaren Graphen. Für die Darstellung bitte ein Amt wählen — die Zähler oben gelten für den Gesamtbestand.</div>`
      :graphSvg(links, rechts, kanten, 'Prozesse', 'Verarbeitungstätigkeiten')}</div>`;
}

function graphMarkieren(id){
  const svg=document.getElementById('dep-graph'); if(!svg) return;
  S.graphSel = (S.graphSel===id) ? null : id;
  const sel=S.graphSel;
  const info=document.getElementById('graph-info');
  svg.classList.toggle('markiert', !!sel);
  const nachbarn=new Set();
  svg.querySelectorAll('.gk').forEach(k=>{
    const an = !sel || k.dataset.t===sel || k.dataset.m===sel;
    k.classList.toggle('hell', !!sel && an);
    k.classList.toggle('blass', !!sel && !an);
    if(sel && an){ nachbarn.add(k.dataset.t); nachbarn.add(k.dataset.m); }
  });
  svg.querySelectorAll('.gn').forEach(n=>{
    const an = !sel || n.dataset.id===sel || nachbarn.has(n.dataset.id);
    n.classList.toggle('blass', !!sel && !an);
    n.classList.toggle('aktiv', n.dataset.id===sel);
  });
  if(info){
    if(!sel){ info.textContent='Gefährdung oder Maßnahme anklicken, um ihre Verknüpfungen hervorzuheben'; return; }
    const t=BEDROHUNGEN.find(x=>x.id===sel), m=TOMS.find(x=>x.id===sel);
    const n=[...nachbarn].filter(x=>x!==sel).length;
    info.innerHTML = t
      ? `<b>${esc(t.id)}</b> ${esc(t.name||'')} — ${n} Maßnahme${n===1?'':'n'} · ${esc((t.ziele||[]).join(', '))}
         <div style="margin-top:5px;color:var(--fg-faint)">${esc(String(t.beschreibung||'').slice(0,320))}</div>`
      : m ? `<b>${esc(m.id)}</b> ${esc(m.name||'')} — deckt ${n} Gefährdung${n===1?'':'en'} · ${esc(m.typ||'')} · Wirkung ${m.wirkung??'—'}
         <div style="margin-top:5px;color:var(--fg-faint)">${esc(String(m.beschreibung||'').slice(0,320))}</div>`
      : esc(sel);
  }
}

/* Klassische 4×4-Matrix. `zaehler` blendet statt der Produktzahl die Anzahl
   der Verarbeitungstätigkeiten in jedem Feld ein. */
function risikoMatrix(schaden, wahrsch, zaehler){
  const cls=n=>n>=12?'err':n>=8?'warn':n>=4?'warn':'ok';
  const kopf=[1,2,3,4].map(w=>`<th class="num">${w}</th>`).join('');
  const zeilen=[4,3,2,1].map(sh=>`<tr><th style="text-align:right">${sh}</th>${
    [1,2,3,4].map(w=>{
      const prod=sh*w, hier=(sh===schaden&&w===wahrsch);
      const n=zaehler?(zaehler[sh+'x'+w]||0):null;
      return `<td class="num"${hier?' style="outline:2px solid var(--focus);outline-offset:-2px"':''}>
        <span class="pill ${cls(prod)}"${n!==null?' title="Produkt '+prod+'"':''}>${n!==null?n:prod}</span></td>`;
    }).join('')}</tr>`).join('');
  return `<table class="tab" style="max-width:560px">
    <thead><tr><th style="width:150px">Schaden ↓ / Wahrsch. →</th>${kopf}</tr></thead>
    <tbody>${zeilen}</tbody></table>`;
}

/* Übersicht über alle Verarbeitungstätigkeiten mit Risikoanalyse. */
function risikoUebersicht(){
  const rs=Object.values(K.risiko);
  if(!rs.length) return '<div class="hinweis warn">Keine Risikoanalysen geladen.</div>';
  const zaehler={}, werte={}, bedarf={};
  const dims={dsgvo:0, bsi_vertraulichkeit:0, bsi_integritaet:0, bsi_verfuegbarkeit:0};
  rs.forEach(r=>{
    const B=r.basis_risiko||{};
    const sh=(r.besonderheiten_referenz||{}).schadenshoehe_aus_besonderheiten;
    const ew=B.eintrittswahrscheinlichkeit;
    if(sh&&ew) zaehler[sh+'x'+ew]=(zaehler[sh+'x'+ew]||0)+1;
    if(B.gesamtwert!=null) werte[B.gesamtwert]=(werte[B.gesamtwert]||0)+1;
    const sb=(B.schutzbedarf||'—'); bedarf[sb]=(bedarf[sb]||0)+1;
    Object.keys(dims).forEach(k=>{ if(((B[k]||{}).wert||0)>=6) dims[k]++; });
  });
  const maxW=Math.max(...Object.values(werte),1);
  const dimName={dsgvo:'DSGVO', bsi_vertraulichkeit:'BSI Vertraulichkeit',
                 bsi_integritaet:'BSI Integrität', bsi_verfuegbarkeit:'BSI Verfügbarkeit'};
  return `
    <div class="karten" style="margin-bottom:18px">
      ${Object.entries(bedarf).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
        `<div class="karte"><div class="karte-zahl">${n}</div><div class="karte-label">Schutzbedarf ${esc(k)}</div>
          <div class="karte-fuss">${Math.round(n/rs.length*100)} % von ${rs.length}</div></div>`).join('')}
    </div>

    <div class="sektion-label" style="max-width:940px">Verteilung der Gesamtwerte (Maximum der vier Dimensionen)</div>
    <table class="tab" style="max-width:700px">
      <thead><tr><th style="width:90px">Wert</th><th>Verteilung</th><th class="num" style="width:70px">VT</th></tr></thead>
      <tbody>${Object.keys(werte).map(Number).sort((a,b)=>a-b).map(v=>`<tr>
        <td><span class="pill ${v>=12?'err':v>=6?'warn':'ok'}">${v}</span></td>
        <td><div class="balken" style="margin:0"><i style="width:${Math.round(werte[v]/maxW*100)}%"></i></div></td>
        <td class="num">${werte[v]}</td></tr>`).join('')}</tbody></table>

    <div class="sektion-label" style="margin-top:26px;max-width:940px">Welche Dimension treibt das Risiko (Wert ≥ 6)</div>
    <table class="tab" style="max-width:700px">
      <thead><tr><th>Dimension</th><th>Anteil</th><th class="num" style="width:70px">VT</th></tr></thead>
      <tbody>${Object.entries(dims).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr>
        <td>${dimName[k]}</td>
        <td><div class="balken" style="margin:0"><i style="width:${Math.round(n/rs.length*100)}%"></i></div></td>
        <td class="num">${n}</td></tr>`).join('')}</tbody></table>

    <div class="sektion-label" style="margin-top:26px;max-width:940px">Belegung der Risikomatrix (Anzahl VT je Feld)</div>
    ${risikoMatrix(null,null,zaehler)}`;
}
